name: Verify life potion build
on:
  push:
    branches: [codex/verify-life-potion-79b9c843]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build with Gradle
        run: ./gradlew build --no-daemon
