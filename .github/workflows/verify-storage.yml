name: Verify alchemy chance and losses
on:
  push:
    branches:
      - 'verify-alchemy-chance-1795593437533'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build mod
        run: ./gradlew build --no-daemon --console=plain
      - name: Prepare game-test server
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
      - name: Test probability, losses and existing features
        run: timeout 300s ./gradlew runGameTestServer --no-daemon --console=plain
