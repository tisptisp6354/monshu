name: Verify Original Potion Icons
on:
  push:
    branches:
      - 'verify/original-potion-icons-1795429673795'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build mod
        run: ./gradlew build --no-daemon
